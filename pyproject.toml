[project]
name = "codex-remote-pro"
version = "0.1.0"
description = "Connect GPT Pro to a running Codex CLI session - read output, send instructions, from desktop or phone"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.9",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-timeout>=2",
    "httpx>=0.27",
]

[project.scripts]
codex-remote = "codex_bridge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
timeout = 60
testpaths = ["tests"]
